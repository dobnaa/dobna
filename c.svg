  <!-- Globe / World Icon -->
  <g fill="none" stroke="#505050" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="530" cy="500" r="68"/>
    <line x1="530" y1="432" x2="530" y2="568"/>
    <line x1="462" y1="500" x2="598" y2="500"/>
    <line x1="472" y1="466" x2="588" y2="466"/>
    <line x1="472" y1="534" x2="588" y2="534"/>
    <ellipse cx="530" cy="500" rx="34" ry="68"/>
  </g>
</svg>
